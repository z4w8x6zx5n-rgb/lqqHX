<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="刘启全化学冲刺网页试卷页，基础版答案可点击展开，加强版用于综合训练。">
  <title>试卷测试 - 刘启全化学冲刺网页</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header paper-header">
    <div class="topbar">
      <a class="home-btn" href="index.html">🏠 返回首页</a>
      <div class="brand">刘启全化学冲刺网页</div>
    </div>
    <section class="hero compact-hero">
      <p class="eyebrow">📄 独立试卷页</p>
      <h1>先做题，再展开答案订正</h1>
      <p class="hero-text">答案默认隐藏，做完再点开。真正的提分，不是看懂答案，而是把自己的思路修到更准。🔥</p>
    </section>
  </header>

  <main>
    <section class="paper-layout">
      <aside class="paper-sidebar">
        <h2>专题试卷</h2>
        <div id="paperTopicList" class="paper-topic-list"></div>
      </aside>
      <article id="paperPage" class="detail"></article>
    </section>
  </main>

  <footer class="footer">
    <p>✨ 做题时先遮住答案，订正时把错因写清楚。每一道错题都在帮你补洞。</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
